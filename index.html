<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B2D">
<title>Markas Agent</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="stage" aria-label="Pemandangan 3D markas agent"></canvas>
<div id="bubbles"></div>
<div class="loading" id="loading">Menyusun markas…</div>

<header>
  <div>
    <h1>Markas Agent</h1>
    <p></p>
  </div>
  <span class="sample" title="Status ini simulasi. Sambung ke agent sebenar untuk data hidup.">Data contoh</span>
</header>

<div class="dock" id="dock">
  <div class="tabs" id="tabs" role="group" aria-label="Pilih pejabat"></div>
  <div class="roster" id="roster"></div>
</div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="top">
    <div class="av" id="sAv"></div>
    <div><h2 id="sName"></h2><p class="role" id="sRole"></p></div>
    <button class="close" id="sClose">Tutup</button>
  </div>
  <h3>Sedang buat</h3>
  <p class="now" id="sNow"></p>
  <h3>Senarai tugas</h3>
  <ul id="sTasks"></ul>
  <span class="office" id="sOffice"></span>
</section>

<script type="module" src="/src/main.js"></script>
</body>
</html>
