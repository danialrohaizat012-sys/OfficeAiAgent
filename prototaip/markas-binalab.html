<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markas Agent: BinaLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --space:#060913;
  --glass:rgba(250,252,255,.88);
  --glass-line:rgba(15,27,45,.12);
  --ink:#0F1B2D;
  --ink-soft:#4A5568;
  --chip:#ffffff;
  --chip-on:#0F1B2D;
  --chip-on-ink:#ffffff;
  --bina:#3FAE5C;
  --meney:#7DB62F;
  --hub:#8E9BFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --glass:rgba(14,19,34,.82);
    --glass-line:rgba(255,255,255,.10);
    --ink:#EEF2F7;
    --ink-soft:#9AA5B8;
    --chip:rgba(255,255,255,.06);
    --chip-on:#EEF2F7;
    --chip-on-ink:#0B1020;
    --bina:#4CC26C;
    --meney:#8DC63F;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --glass:rgba(14,19,34,.82);
  --glass-line:rgba(255,255,255,.10);
  --ink:#EEF2F7;
  --ink-soft:#9AA5B8;
  --chip:rgba(255,255,255,.06);
  --chip-on:#EEF2F7;
  --chip-on-ink:#0B1020;
  --bina:#4CC26C;
  --meney:#8DC63F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--space);color:var(--ink);
  font-family:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:block;touch-action:none}
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--glass);
  border:1px solid var(--glass-line);color:var(--ink);font-size:12px;line-height:1.3;
  padding:6px 10px 7px;border-radius:12px 12px 12px 3px;white-space:nowrap;max-width:62vw;
  overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity .35s ease}
.bubble.show{opacity:1}
.bubble b{display:block;font-size:10.5px;font-weight:600;color:var(--ink-soft)}

header{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
header h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em;color:#EEF2F7;
  text-shadow:0 2px 12px rgba(0,0,0,.6)}
header p{margin:3px 0 0;font-size:12px;color:#AEB8CA}
.sample{pointer-events:auto;font-size:11px;color:#C9D2E2;border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:5px 10px;background:rgba(6,9,19,.55)}

.dock{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 10px)}
.tabs{display:flex;gap:6px;justify-content:center;padding:0 12px 10px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--glass-line);
  background:var(--glass);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabs button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:transparent}
.roster{display:flex;gap:8px;overflow-x:auto;padding:2px 12px 2px;scrollbar-width:none;scroll-snap-type:x proximity}
.roster::-webkit-scrollbar{display:none}
.agent{flex:0 0 auto;scroll-snap-align:start;display:flex;gap:9px;align-items:center;text-align:left;
  font:inherit;color:var(--ink);background:var(--glass);border:1px solid var(--glass-line);
  border-radius:14px;padding:8px 12px 8px 8px;min-width:178px;max-width:220px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.agent[hidden]{display:none}
.agent.on{outline:2px solid var(--sel,#fff);outline-offset:-1px}
.av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;
  font-size:12px;font-weight:700;color:#0B1020;position:relative}
.av::after{content:"";position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;
  background:#46D37A;border:2px solid var(--space)}
.agent.busy .av::after{background:#F2C14E}
.agent .t{min-width:0}
.agent .n{font-size:13px;font-weight:600;display:block}
.agent .s{font-size:11px;color:var(--ink-soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}

.sheet{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  max-width:440px;margin:0 auto;background:var(--glass);border:1px solid var(--glass-line);border-radius:20px;
  padding:16px 16px 14px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transform:translateY(calc(100% + 40px));transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}
.sheet.open{transform:none}
.sheet .top{display:flex;gap:12px;align-items:center}
.sheet .av{width:44px;height:44px;flex-basis:44px;font-size:16px}
.sheet h2{margin:0;font-size:17px}
.sheet .role{margin:2px 0 0;font-size:12.5px;color:var(--ink-soft)}
.sheet .close{margin-left:auto;font:inherit;font-size:13px;font-weight:600;background:transparent;
  border:1px solid var(--glass-line);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}
.sheet h3{margin:14px 0 6px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.sheet .now{margin:0;font-size:14.5px;line-height:1.45}
.sheet ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.sheet li{font-size:13px;line-height:1.4;display:flex;gap:8px}
.sheet li::before{content:"";flex:0 0 6px;height:6px;margin-top:7px;border-radius:50%;background:var(--acc,#888)}
.sheet .office{display:inline-block;margin-top:12px;font-size:11.5px;color:var(--ink-soft)}
button:focus-visible{outline:2px solid #8E9BFF;outline-offset:2px}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:#AEB8CA;font-size:13px}
@media (min-width:900px){
  header h1{font-size:24px}
  .roster{justify-content:center;flex-wrap:wrap}
}
</style>
</head>

function roundedShape(w,d,r){
  const s=new THREE.Shape(),x=-w/2,y=-d/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+d-r);

  [-.12,.12].forEach(x=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.05,10,8),eyeM);e.position.set(x,1.16,.4);g.add(e)});
  const ant=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.22,6),mat); ant.position.y=1.62; g.add(ant);
  const tip=new THREE.Mesh(new THREE.SphereGeometry(.06,10,8),new THREE.MeshBasicMaterial({color:c})); tip.position.y=1.75; g.add(tip);
  g.userData.tip=tip;
  return g;
}

function logoSprite(svg,w,h,accent,scale){
  const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
  const ctx=cv.getContext("2d");
  const tex=new THREE.CanvasTexture(cv);
  tex.anisotropy=4;
  const img=new Image();
  img.onload=()=>{
    const pad=46,r=56;
    ctx.clearRect(0,0,w,h);
    ctx.beginPath();ctx.moveTo(r,6);ctx.arcTo(w-6,6,w-6,h-6,r);ctx.arcTo(w-6,h-6,6,h-6,r);ctx.arcTo(6,h-6,6,6,r);ctx.arcTo(6,6,w-6,6,r);ctx.closePath();
    ctx.fillStyle="rgba(8,12,24,0.86)";ctx.fill();
    ctx.lineWidth=6;ctx.strokeStyle=accent;ctx.globalAlpha=.9;ctx.stroke();ctx.globalAlpha=1;
    const ar=img.naturalWidth/img.naturalHeight; let dw=w-pad*2, dh=dw/ar;
    if(dh>h-pad*2){dh=h-pad*2;dw=dh*ar}
    ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);
    tex.needsUpdate=true;
  };
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(scale*w/h,scale,1);
  return sp;
}

const officeGroups={}, agentMeshes=[], pickables=[], bobbers=[];
// hub
{
  const o=OFFICES.command, grp=new THREE.Group(); grp.position.set(...o.pos);
  const shape=new THREE.Shape(); for(let i=0;i<8;i++){const a=i/8*Math.PI*2+Math.PI/8;const x=Math.cos(a)*3.4,y=Math.sin(a)*3.4;i?shape.lineTo(x,y):shape.moveTo(x,y)} shape.closePath();
  grp.add(platform(shape,o.color));
  const beam=new THREE.Mesh(new THREE.CylinderGeometry(.35,.55,40,24,1,true),
    new THREE.MeshBasicMaterial({color:0x9fd4ff,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
  beam.position.y=20; grp.add(beam);
  const core=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,40,12),new THREE.MeshBasicMaterial({color:0xe6f4ff,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
  core.position.y=20; grp.add(core);
  for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.8+i*.35,.02,8,64),new THREE.MeshBasicMaterial({color:0x9fd4ff,transparent:true,opacity:.6-i*.15}));
    ring.rotation.x=Math.PI/2; ring.position.y=.08+i*.02; ring.userData.spin=(i%2?-1:1)*(.4+i*.2); grp.add(ring); bobbers.push({m:ring,type:"spin"});}
  const console_=new THREE.Mesh(new THREE.BoxGeometry(1.6,.5,.7),new THREE.MeshStandardMaterial({color:0x2a3149,emissive:0x3b44a0,emissiveIntensity:.35}));
  console_.position.set(0,.25,1.6); grp.add(console_);
  scene.add(grp); officeGroups.command=grp;
}
// offices
[["binalab",LOGOS.binalab_dark,"#4CC26C",1024,1240,4.4]].forEach(([key,svg,acc,w,h,sc])=>{
  const o=OFFICES[key], grp=new THREE.Group(); grp.position.set(...o.pos);
  grp.add(platform(roundedShape(7.6,6.2,1.1),o.color));
  const deskSpots=[[-1.8,-1.2],[1.8,-1.2],[-1.8,1.4],[1.8,1.4]];
  deskSpots.forEach(([x,z])=>{const d=desk(o.color);d.position.set(x,0,z);grp.add(d)});
  const sp=logoSprite(svg,w,h,acc,sc); sp.position.set(0,5.4,-2.6); grp.add(sp); bobbers.push({m:sp,type:"bob",base:5.4,ph:key==="meney"?1.3:0});
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,3.2,8),new THREE.MeshBasicMaterial({color:o.color,transparent:true,opacity:.5}));
  pole.position.set(0,1.6,-2.6); grp.add(pole);
  scene.add(grp); officeGroups[key]=grp; grp.userData.spots=deskSpots;
});
// bridges
function bridge(a,b,color){
  const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),dir=B.clone().sub(A),len=dir.length();
  const mid=A.clone().add(B).multiplyScalar(.5);
  const m=new THREE.Mesh(new THREE.BoxGeometry(.9,.12,len),new THREE.MeshStandardMaterial({color:0x1d2338,roughness:.8}));
  m.position.copy(mid); m.position.y=-.05; m.lookAt(B.x,-.05,B.z); scene.add(m);
  const dots=[];for(let i=0;i<6;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.07,8,6),new THREE.MeshBasicMaterial({color}));scene.add(d);dots.push(d)}
  return {A,B,dots};
}
const bridges=[bridge(OFFICES.command.pos,OFFICES.binalab.pos,0x4CC26C)];

// agents
const officeCount={binalab:0};
AGENTS.forEach(a=>{
  const r=robot(a.color); let pos;
  if(a.office==="command"){pos=new THREE.Vector3(0,0,.6)}
  else{const g=officeGroups[a.office],[x,z]=g.userData.spots[officeCount[a.office]++];pos=new THREE.Vector3(x,0,z+.75)}
  r.position.copy(pos);
  officeGroups[a.office].add(r);
  r.traverse(m=>{if(m.isMesh){m.userData.agent=a.id;pickables.push(m)}});
  a.mesh=r; a.ph=Math.random()*6;
});

// UI
const roster=document.getElementById("roster"), bubbles=document.getElementById("bubbles");
const officeName={command:"Command",binalab:"BinaLab",meney:"Meney Gaming"};
AGENTS.forEach(a=>{
  const b=document.createElement("button");b.className="agent"+(a.busy?" busy":"");b.dataset.id=a.id;b.dataset.o=a.office;
  b.style.setProperty("--sel",a.color);
  b.innerHTML=`<span class="av" style="background:${a.color}">${a.name[0]}</span><span class="t"><span class="n">${a.name}</span><span class="s">${a.tasks[0]}</span></span>`;
  b.onclick=()=>select(a.id,true); roster.appendChild(b); a.chip=b;
  const bb=document.createElement("div");bb.className="bubble";bb.innerHTML=`<b>${a.name}</b><span>${a.tasks[0]}</span>`;
  bubbles.appendChild(bb); a.bubble=bb;
});
let filter="all";
document.querySelectorAll(".tabs button").forEach(btn=>btn.onclick=()=>{
  filter=btn.dataset.f;
  document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===btn));
  AGENTS.forEach(a=>a.chip.hidden=!(filter==="all"||a.office===filter));
  closeSheet(); focus(filter==="all"?null:filter);
});

// camera framing
const home={target:new THREE.Vector3(0,1,-.6)};
let tween=null;
function frameDist(){const asp=innerWidth/innerHeight;return asp<.8?30:asp<1.2?24:20}
function homePos(){const d=frameDist();return new THREE.Vector3(0,d*.62,d*.82)}
function focus(key,agentPos){
  let tgt,pos;
  if(!key){tgt=home.target.clone();pos=homePos()}
  else{
    const base=new THREE.Vector3(...OFFICES[key].pos);
    tgt=agentPos?agentPos.clone().setY(1):base.clone().setY(.8);
    const d=(agentPos?8:13)*(innerWidth/innerHeight<.8?1.45:1);
    const dir=tgt.clone().setY(0).normalize(); if(dir.lengthSq()<.01)dir.set(0,0,1);
    pos=tgt.clone().add(new THREE.Vector3(dir.x*d*.35,d*.6,d*.8));
  }
  tween={t:0,dur:reduce?1:1.1,p0:camera.position.clone(),p1:pos,t0:controls.target.clone(),t1:tgt};
  controls.autoRotate=false;
}

const sheet=document.getElementById("sheet");
let selected=null;
function select(id,fromChip){
  const a=AGENTS.find(x=>x.id===id); if(!a)return; selected=a;
  AGENTS.forEach(x=>x.chip.classList.toggle("on",x===a));
  document.getElementById("sAv").textContent=a.name[0];document.getElementById("sAv").style.background=a.color;
  document.getElementById("sName").textContent=a.name;
  document.getElementById("sRole").textContent=a.role;
  document.getElementById("sNow").textContent=a.tasks[a.step];
  const ul=document.getElementById("sTasks");ul.innerHTML="";ul.style.setProperty("--acc",a.color);
  a.tasks.forEach(t=>{const li=document.createElement("li");li.textContent=t;ul.appendChild(li)});
  document.getElementById("sOffice").textContent="Pejabat: "+officeName[a.office];
  sheet.classList.add("open");document.getElementById("dock").style.visibility="hidden";
  const wp=new THREE.Vector3();a.mesh.getWorldPosition(wp);focus(a.office,wp);
  if(fromChip)a.chip.scrollIntoView({behavior:reduce?"auto":"smooth",inline:"center",block:"nearest"});
}
function closeSheet(){sheet.classList.remove("open");document.getElementById("dock").style.visibility="";selected=null;AGENTS.forEach(x=>x.chip.classList.remove("on"))}
document.getElementById("sClose").onclick=()=>{closeSheet();focus(filter==="all"?null:filter)};

// tap to pick
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down=null;
canvas.addEventListener("pointerdown",e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener("pointerup",e=>{
  if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const hit=ray.intersectObjects(pickables,false)[0];
  if(hit)select(hit.object.userData.agent,true);
});
controls.addEventListener("start",()=>{tween=null;controls.autoRotate=false});

// simulated activity
const shown=new Set();
function tick(){
  const pool=AGENTS.filter(a=>filter==="all"||a.office===filter);
  const a=pool[Math.floor(Math.random()*pool.length)];
  a.step=(a.step+1)%a.tasks.length; a.busy=!a.busy||Math.random()<.6;
  a.chip.classList.toggle("busy",a.busy);
  a.chip.querySelector(".s").textContent=a.tasks[a.step];
  a.bubble.querySelector("span").textContent=a.tasks[a.step];
  if(selected===a)document.getElementById("sNow").textContent=a.tasks[a.step];
  shown.add(a); a.until=performance.now()+4200;
}
setInterval(tick,2600); tick(); setTimeout(tick,900);

function resize(){
  renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
addEventListener("resize",()=>{resize();if(!selected&&filter==="all"&&!tween){camera.position.copy(homePos())}});
resize(); camera.position.copy(homePos()); controls.target.copy(home.target);
document.getElementById("loading").remove();

const clock=new THREE.Clock(), v=new THREE.Vector3();
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(tween){tween.t+=dt/tween.dur;const k=ease(Math.min(tween.t,1));
    camera.position.lerpVectors(tween.p0,tween.p1,k);controls.target.lerpVectors(tween.t0,tween.t1,k);if(tween.t>=1)tween=null;}
  if(!reduce){
    bobbers.forEach(b=>{if(b.type==="bob")b.m.position.y=b.base+Math.sin(t*1.1+b.ph)*.18;else b.m.rotation.z+=b.m.userData.spin*dt});
    AGENTS.forEach(a=>{a.mesh.position.y=Math.abs(Math.sin(t*2+a.ph))*(a.busy?.06:.02);
      a.mesh.userData.tip.material.color.set(a.busy&&Math.sin(t*6+a.ph)>0?"#ffffff":a.color);});
    bridges.forEach(br=>br.dots.forEach((d,i)=>{const k=((t*.12+i/br.dots.length)%1);d.position.lerpVectors(br.A,br.B,k);d.position.y=.06}));
  } else {
    bridges.forEach(br=>br.dots.forEach((d,i)=>{d.position.lerpVectors(br.A,br.B,(i+.5)/br.dots.length);d.position.y=.06}));
  }
  controls.update();
  renderer.render(scene,camera);
  const now=performance.now();
  AGENTS.forEach(a=>{
    const vis=shown.has(a)&&a.until>now&&(filter==="all"||a.office===filter)&&!a.chip.hidden;
    if(vis){a.mesh.getWorldPosition(v);v.y+=2.15;v.project(camera);
      if(v.z<1){a.bubble.style.left=(v.x*.5+.5)*innerWidth+"px";a.bubble.style.top=(-v.y*.5+.5)*innerHeight+"px"}}
    a.bubble.classList.toggle("show",vis&&v.z<1);
    if(!vis&&a.until<=now)shown.delete(a);
  });
  requestAnimationFrame(loop);
}
loop();
